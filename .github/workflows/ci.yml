# CI for the prototype: type check, tests, build, and the lefthook lint checks,
# so they apply on every PR even where hooks aren't installed.
# Recipes come from the root justfile; tool versions match the devcontainer.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0
      - run: just test
      - run: just build

  # Every file check in lefthook.yml (pre-commit and pre-push) runs here, except:
  # - okf-conformance: needs the librarian plugin at /opt/librarian, which only
  #   exists in the devcontainer.
  # - conform (commit-msg): checks commit messages, not files.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,biome@2.6.7,dprint@0.65.0,taplo@0.10.0,typos@1.52.2,shfmt@3.14.1,shellcheck@0.10.0
      - name: Install rumdl and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From the release's gitleaks_8.30.1_checksums.txt; update with the version.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          uv tool install rumdl==0.3.4
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Merge conflict markers
        run: |
          if git grep -nE '^(<{7} |>{7} |={7}$)' -- . ':!containers'; then
            echo "::error::merge conflict markers found in the files above"
            exit 1
          fi
      # biome, tsc, rumdl, dprint, taplo, shellcheck, shfmt, typos
      - run: just lint
      # Lefthook scans staged changes; CI scans the full history (small repo).
      - run: gitleaks git --redact --no-banner .
