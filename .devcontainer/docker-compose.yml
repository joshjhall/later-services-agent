services:
  devcontainer:
    build:
      # Build from inside the pinned containers submodule.
      context: ../containers
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: mcr.microsoft.com/devcontainers/base:trixie
        PROJECT_NAME: later-services-agent
        USERNAME: vscode
        WORKING_DIR: /workspace/later-services-agent
        # Command-scoped passwordless sudo: the entrypoint runs as vscode and
        # needs sudo only for startup reconciliation (bindfs overlay, /cache
        # chowns, docker-socket group setup), not arbitrary root.
        ENABLE_PASSWORDLESS_SUDO: "scoped"
        # biome, dprint, shellcheck, lefthook, gitleaks, rumdl, typos, just, Claude Code CLI, etc.
        INCLUDE_DEV_TOOLS: "true"
        INCLUDE_OP: "true"
        INCLUDE_HOST_EVENTS: "true"
        # Node 26 (active LTS) + pnpm + typescript-language-server. Node 25+ no
        # longer bundles corepack; the containers node feature installs it.
        INCLUDE_NODE_DEV: "true"
        NODE_VERSION: "26"
        # Docker CLI + docker group; talks to the host daemon via the socket
        # mounted below (not docker-in-docker).
        INCLUDE_DOCKER: "true"
      # No cache_from/cache_to: `type=local` cache export only works with the
      # containerd image store or a docker-container builder, and the default
      # `docker` driver on the classic store refuses the whole build. BuildKit's
      # built-in layer cache covers local rebuilds anyway (containers v4.23.0).
    volumes:
      - ..:/workspace/later-services-agent
      # Host Docker daemon. Grants full host-daemon access to anything running
      # in this container; acceptable for a local dev box.
      - /var/run/docker.sock:/var/run/docker.sock
      # codegraph index: <project>/.codegraph is symlinked here by the dev-tools
      # first-startup hook (out of the git tree, droppable to re-index).
      - later-services-agent-codegraph:/cache/codegraph
      # pnpm content-addressable store at /cache/pnpm (the store-dir the
      # containers node feature configures): survives rebuilds so reinstalls skip
      # the network. It sits on a different filesystem from app/node_modules, so
      # pnpm copies instead of hard-linking (fine at this size).
      - later-services-agent-pnpm-store:/cache/pnpm
    tmpfs:
      # 1Password cache is kept in memory. No uid=/gid=: paths under /cache are
      # aligned to the runtime user by fix_cache_permissions.
      - /cache/1password/secrets:size=8m,mode=0700
    # Optional: .env is gitignored local state and absent in fresh worktrees.
    # Secrets (OP_SERVICE_ACCOUNT_TOKEN) belong in .env.secrets, which is loaded
    # at shell init so `docker compose config` never prints them.
    env_file:
      - path: ../.env
        required: false
    environment:
      CLAUDE_MCPS: "filesystem,codegraph"
      # The workspace mount is case-insensitive (macOS host), so `just` can see
      # a phantom `Justfile` beside the tracked `justfile` and refuse to run.
      JUST_JUSTFILE: /workspace/later-services-agent/justfile
    # Vite dev server (`just dev`) and the Slidev deck (`just slides`). Published
    # on the host's loopback only: neither has auth, and Zed does not
    # auto-forward ports like VS Code.
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3030:3030"
    init: true
    # CAP_SYS_ADMIN + /dev/fuse are the minimum for the bindfs FUSE overlay that
    # fixes macOS VirtioFS ownership on the workspace bind mount. It degrades to
    # a no-op when /dev/fuse is absent.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    command: ["sleep", "infinity"]
    networks:
      - later-services-agent-network

networks:
  later-services-agent-network:
    driver: bridge

volumes:
  # The /cache prefix is load-bearing: fix_cache_permissions aligns it to the
  # runtime user.
  later-services-agent-codegraph:
  later-services-agent-pnpm-store:
